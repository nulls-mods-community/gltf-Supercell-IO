name: Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Get release version from tag
        id: version
        run: |
          echo "version=${GITHUB_REF#refs/*/v}" >> $GITHUB_OUTPUT

      - name: Build plugin zip (wheels generated at build time)
        run: |
          ./scripts/build.py release ${{steps.version.outputs.version}}

      - name: Commit and push index.json
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add index.json
          git diff --staged --quiet || git commit -m "Update index.json for ${{ steps.version.outputs.version }}"
          git push origin HEAD:main

      - name: Create GitHub Release and Upload Files
        uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          name: ${{ github.event.repository.name }}-${{steps.version.outputs.version}}
          files: dist/*
          generate_release_notes: true
